name: KTV Legacy and OS tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ktv-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Testar servidor e widgets Orsay
        run: python -m unittest discover -s tests -v
      - name: Gerar widgets
        run: python installer-local/build.py --ip 192.168.1.10
      - name: Verificar JS Orsay
        run: node --check tv-orsay/js/app.js
      - name: Testar KTV OS local
        run: python -m unittest discover -s ktv-os/tests -v
      - name: Verificar JavaScript KTV OS
        run: node --check ktv-os/app/app.js
      - name: Verificar teclado e navegador KTV Verde
        run: |
          node --check ktv-os/app/osk.js
          node --check ktv-os/app/browser-green.js
      - name: Verificar construtor Linux Live (sem gerar ISO)
        run: |
          bash -n ktv-os/linux-live/build-iso.sh
          bash -n ktv-os/linux-live/overlay/usr/local/bin/ktv-os-session
          bash ktv-os/linux-live/build-iso.sh --check
