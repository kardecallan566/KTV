name: Build KTV OS Bootable ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ktv-os/linux-live/**"
      - "ktv-os/launcher.py"
      - "ktv-os/player.py"
      - "ktv-os/channel_store.py"
      - "ktv-os/persistence.py"
      - "ktv-os/hardware.py"
      - "ktv-os/cec_bridge.py"
      - "ktv-os/network.py"
      - "ktv-os/display_layout.py"
      - "ktv-os/system_actions.py"
      - "ktv-os/public_channels.py"
      - "ktv-os/app/**"
      - ".github/workflows/build-ktv-os-iso.yml"

permissions:
  contents: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Compilar no Debian 13 (mesma distribuicao-alvo)
        run: |
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends live-build debootstrap \
                xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
                syslinux-utils isolinux mtools dosfstools ca-certificates
              bash -n ktv-os/linux-live/build-iso.sh
              bash -n ktv-os/linux-live/overlay/usr/local/bin/ktv-os-session
              bash ktv-os/linux-live/build-iso.sh --check
              bash ktv-os/linux-live/build-iso.sh
            '
      - name: Conferir integridade da ISO gerada
        run: |
          cd ktv-os/linux-live/dist
          shopt -s nullglob
          isos=(KTV-OS-Alpha-*.iso)
          test "${#isos[@]}" -eq 1
          test -s "${isos[0]}"
          sha256sum -c "${isos[0]}.sha256"
          echo "ISO conferida: ${isos[0]}"
      - name: Disponibilizar ISO inicializavel
        uses: actions/upload-artifact@v6
        with:
          name: KTV-OS-Alpha-0.8-amd64
          path: |
            ktv-os/linux-live/dist/KTV-OS-Alpha-*.iso
            ktv-os/linux-live/dist/KTV-OS-Alpha-*.iso.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
