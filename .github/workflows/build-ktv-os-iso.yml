name: Build KTV OS PC ISO + Raspberry Pi 3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ktv-os/**"
      - "ktv-os/iptv_free_catalog.json"
      - "ktv-os/pluto_catalog.py"
      - ".github/workflows/build-ktv-os-iso.yml"

permissions:
  contents: read

jobs:
  iso:
    name: Build PC bootable ISO (amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
      - name: Identificar versao do aplicativo
        id: version
        shell: bash
        run: |
          version="$(sed -nE "s/^VERSION = '([0-9]+\.[0-9]+)\.[0-9]+'$/\1/p" ktv-os/launcher.py)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Compilar no Debian 13 (mesma distribuicao-alvo)
        run: |
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            debian:trixie bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends live-build debootstrap \
                xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin \
                syslinux-utils isolinux mtools dosfstools ca-certificates
              bash -n ktv-os/linux-live/build-iso.sh
              bash -n ktv-os/linux-live/overlay/usr/local/bin/ktv-os-session
              bash ktv-os/linux-live/build-iso.sh --check
              bash ktv-os/linux-live/build-iso.sh
            '
      - name: Conferir integridade da ISO gerada
        run: |
          cd ktv-os/linux-live/dist
          expected="KTV-OS-Alpha-${{ steps.version.outputs.version }}-amd64.iso"
          test -s "$expected"
          test -s "$expected.sha256"
          sha256sum -c "$expected.sha256"
          echo "ISO conferida: $expected"
      - name: Disponibilizar ISO inicializavel para PC
        uses: actions/upload-artifact@v6
        with:
          name: KTV-OS-Alpha-${{ steps.version.outputs.version }}-amd64
          path: |
            ktv-os/linux-live/dist/KTV-OS-Alpha-*.iso
            ktv-os/linux-live/dist/KTV-OS-Alpha-*.iso.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  raspberry-pi-3:
    name: Build Raspberry Pi 3 Model B image (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Checkout KTV OS
        uses: actions/checkout@v6

      - name: Download pinned Raspberry Pi image generator
        env:
          RPI_IMAGE_GEN_REF: v2.9.0
        shell: bash
        run: |
          set -Eeuo pipefail
          git clone --depth 1 --branch "$RPI_IMAGE_GEN_REF" \
            https://github.com/raspberrypi/rpi-image-gen.git "$RUNNER_TEMP/rpi-image-gen"
          cd "$RUNNER_TEMP/rpi-image-gen"
          sudo ./install_deps.sh

      - name: Lint image configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGEGEN_DIR="$RUNNER_TEMP/rpi-image-gen"
          SOURCE_DIR="$GITHUB_WORKSPACE/ktv-os/arm64-image"
          CONFIG="$SOURCE_DIR/config/ktv-os-pi3.yaml"
          cd "$IMAGEGEN_DIR"
          ./rpi-image-gen metadata --lint "$SOURCE_DIR/layer/ktv-os.yaml"
          test -s "$CONFIG"
          grep -qE '^[[:space:]]+layer:[[:space:]]+rpi3
          grep -q 'name: ktv-os-arm64-pi3' "$CONFIG"

      - name: Build bootable Raspberry Pi 3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGEGEN_DIR="$RUNNER_TEMP/rpi-image-gen"
          SOURCE_DIR="$GITHUB_WORKSPACE/ktv-os/arm64-image"
          CONFIG="$SOURCE_DIR/config/ktv-os-pi3.yaml"
          cd "$IMAGEGEN_DIR"
          ./rpi-image-gen build -S "$SOURCE_DIR" -c "$CONFIG"

      - name: Validate and compress Raspberry Pi 3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE_NAME="ktv-os-arm64-pi3"
          IMAGEGEN_DIR="$RUNNER_TEMP/rpi-image-gen"
          OUT_DIR="$GITHUB_WORKSPACE/dist/raspberry-pi-3"
          IMAGE_PATH="$IMAGEGEN_DIR/work/image-${IMAGE_NAME}/${IMAGE_NAME}.img"
          mkdir -p "$OUT_DIR"

          test -s "$IMAGE_PATH"
          file "$IMAGE_PATH"
          fdisk -l "$IMAGE_PATH"

          OUTPUT="KTV-OS-Raspberry-Pi-3-Model-B.img.xz"
          xz -T0 -6 -c "$IMAGE_PATH" > "$OUT_DIR/$OUTPUT"
          test -s "$OUT_DIR/$OUTPUT"
          (cd "$OUT_DIR" && sha256sum "$OUTPUT" > "$OUTPUT.sha256")
          (cd "$OUT_DIR" && sha256sum -c "$OUTPUT.sha256")

      - name: Publish Raspberry Pi 3 image
        uses: actions/upload-artifact@v6
        with:
          name: KTV-OS-Raspberry-Pi-3-Model-B
          path: |
            dist/raspberry-pi-3/KTV-OS-Raspberry-Pi-3-Model-B.img.xz
            dist/raspberry-pi-3/KTV-OS-Raspberry-Pi-3-Model-B.img.xz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
 "$CONFIG"
          grep -q 'name: ktv-os-arm64-pi3' "$CONFIG"

      - name: Build bootable Raspberry Pi 3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGEGEN_DIR="$RUNNER_TEMP/rpi-image-gen"
          SOURCE_DIR="$GITHUB_WORKSPACE/ktv-os/arm64-image"
          CONFIG="$SOURCE_DIR/config/ktv-os-pi3.yaml"
          cd "$IMAGEGEN_DIR"
          ./rpi-image-gen build -S "$SOURCE_DIR" -c "$CONFIG"

      - name: Validate and compress Raspberry Pi 3 image
        shell: bash
        run: |
          set -Eeuo pipefail
          IMAGE_NAME="ktv-os-arm64-pi3"
          IMAGEGEN_DIR="$RUNNER_TEMP/rpi-image-gen"
          OUT_DIR="$GITHUB_WORKSPACE/dist/raspberry-pi-3"
          IMAGE_PATH="$IMAGEGEN_DIR/work/image-${IMAGE_NAME}/${IMAGE_NAME}.img"
          mkdir -p "$OUT_DIR"

          test -s "$IMAGE_PATH"
          file "$IMAGE_PATH"
          fdisk -l "$IMAGE_PATH"

          OUTPUT="KTV-OS-Raspberry-Pi-3-Model-B.img.xz"
          xz -T0 -6 -c "$IMAGE_PATH" > "$OUT_DIR/$OUTPUT"
          test -s "$OUT_DIR/$OUTPUT"
          (cd "$OUT_DIR" && sha256sum "$OUTPUT" > "$OUTPUT.sha256")
          (cd "$OUT_DIR" && sha256sum -c "$OUTPUT.sha256")

      - name: Publish Raspberry Pi 3 image
        uses: actions/upload-artifact@v6
        with:
          name: KTV-OS-Raspberry-Pi-3-Model-B
          path: |
            dist/raspberry-pi-3/KTV-OS-Raspberry-Pi-3-Model-B.img.xz
            dist/raspberry-pi-3/KTV-OS-Raspberry-Pi-3-Model-B.img.xz.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
