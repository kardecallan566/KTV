name: KTV App Windows
on:
  workflow_dispatch:
  push:
    paths:
      - "ktv-os/**"
      - ".github/workflows/ktv-app-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r ktv-os/requirements-windows.txt
      - name: Package desktop app
        working-directory: ktv-os
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name KTV-App --collect-all webview --collect-all clr_loader --add-data "app;app" --add-data "iptv_free_catalog.json;." ktv_app.py
      - name: Install 7-Zip
        run: choco install 7zip --yes --no-progress
      - name: Download MPV for Windows
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "mpv-x86_64-*.7z" -and $_.name -notlike "*-v3-*" } | Select-Object -First 1
          if (-not $asset) { throw "Não foi encontrado um pacote MPV x86_64 compatível na última versão." }
          $archive = Join-Path $env:RUNNER_TEMP $asset.name
          $extract = Join-Path $env:RUNNER_TEMP "mpv-windows"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          New-Item -ItemType Directory -Path $extract -Force | Out-Null
          & "$env:ProgramFiles\7-Zip\7z.exe" x $archive "-o$extract" -y
          if ($LASTEXITCODE -ne 0) { throw "Falha ao extrair o pacote MPV." }
          $mpvExe = Get-ChildItem -LiteralPath $extract -Filter "mpv.exe" -File -Recurse | Select-Object -First 1
          if (-not $mpvExe) { throw "mpv.exe não encontrado no pacote baixado." }
          "MPV_SOURCE_DIR=$($mpvExe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Bundle MPV with KTV App
        shell: pwsh
        run: |
          if (-not $env:MPV_SOURCE_DIR) { throw "Diretório do MPV não foi definido." }
          $target = Join-Path $env:GITHUB_WORKSPACE "ktv-os\dist\KTV-App\mpv"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $env:MPV_SOURCE_DIR "*") -Destination $target -Recurse -Force
          if (-not (Test-Path (Join-Path $target "mpv.exe"))) { throw "Falha ao preparar o MPV junto ao KTV App." }
          & (Join-Path $target "mpv.exe") --version
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Compile Windows installer
        working-directory: ktv-os
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\KTV-App.iss'
      - name: Upload Windows app folder
        uses: actions/upload-artifact@v4
        with:
          name: KTV-App-Windows
          path: ktv-os/dist/KTV-App/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KTV-App-Setup
          path: ktv-os/windows/installer-output/KTV-App-Setup.exe
          if-no-files-found: error
          retention-days: 14
