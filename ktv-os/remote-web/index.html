<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10151d"><title>KTV Remote</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="shell"><header><div class="logo">KTV</div><div><h1>Local Remote</h1><p id="status">Conectando…</p></div><span id="dot" class="dot"></span></header>
<section id="pair" class="panel"><h2>Conectar à TV</h2><p>Digite o PIN exibido no KTV OS.</p><form id="pairForm"><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="PIN de 6 dígitos" required><button>Conectar</button></form><small id="pairError"></small></section>
<section id="controls" hidden>
<nav class="tabs"><button class="tab active" data-mode="mouse">Mouse</button><button class="tab" data-mode="tv">TV</button><button class="tab" data-mode="keyboard">Teclado</button></nav>
<section id="mouse" class="panel"><h2>Touchpad</h2><div id="pad" aria-label="Área do touchpad"><span>Deslize para mover o cursor</span></div><div class="clicks"><button data-click="left">Clique esquerdo</button><button data-click="right">Direito</button></div><label class="sensitivity">Sensibilidade <input id="sensitivity" type="range" min="0.6" max="3.5" step="0.1" value="1.8"></label><p class="hint">Dois dedos: rolagem · Toque: clique</p></section>
<section id="tv" class="panel" hidden><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="Enter" class="ok">OK</button><button data-key="ArrowRight">▶</button><button data-key="ArrowDown">▼</button></div><div class="clicks"><button data-key="Escape">Voltar</button><button data-key="Home">Home</button></div></section>
<section id="keyboard" class="panel" hidden><h2>Enviar texto</h2><form id="textForm"><input id="textInput" autocomplete="off" placeholder="Digite para enviar"><button>Enviar</button></form><div class="keys"><button data-key="Backspace">⌫</button><button data-key="Enter">Enter</button><button data-key=" ">Espaço</button></div></section>
<button id="disconnect" class="secondary">Desconectar dispositivo</button><p class="hint">Para revogar todos os pareamentos, abra <b>http://127.0.0.1:8765/pairing</b> na própria TV.</p></section></main><script src="/app.js"></script></body></html>
