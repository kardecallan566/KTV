<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KTV Remote • Pareamento</title><link rel="stylesheet" href="/style.css"><style>body{display:grid;place-items:center;min-height:100vh}.pairtv{text-align:center;max-width:700px;padding:28px}.pinbig{font-size:clamp(48px,12vw,100px);letter-spacing:.18em;font-weight:900;color:#65d6a6;margin:12px 0}.qr{background:white;border-radius:18px;padding:12px;width:220px;height:220px;margin:20px auto}.qr img{width:100%;height:100%}.muted{color:#aab7c8}</style></head><body><main class="pairtv"><div class="logo" style="margin:auto">KTV</div><h1 style="font-size:32px;margin-top:18px">Conecte seu celular</h1><p class="muted">Abra a câmera e escaneie o QR Code ou acesse o endereço da TV.</p><div class="qr"><img id="qr" alt="QR Code de acesso"></div><div class="pinbig" id="pin">••••••</div><p id="url" class="muted">Carregando endereço…</p><p class="muted">Na mesma rede Wi-Fi/LAN · Porta 8765</p><button id="revoke" class="secondary">Revogar todos os pareamentos</button><p id="feedback" class="muted"></p></main><script>fetch('/api/pairing-info').then(r=>r.json()).then(d=>{document.querySelector('#pin').textContent=d.pin;document.querySelector('#url').textContent=d.url;document.querySelector('#qr').src='/api/pairing-qr'}).catch(()=>document.querySelector('#pin').textContent='Indisponível');document.querySelector('#revoke').onclick=async()=>{if(!confirm('Desconectar todos os celulares pareados?'))return;const r=await fetch('/api/revoke',{method:'POST'});document.querySelector('#feedback').textContent=r.ok?'Pareamentos revogados. Faça novo pareamento no celular.':'Abra esta tela diretamente na TV para revogar.'}</script></body></html>
