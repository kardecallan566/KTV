<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<title>KTV Boot Test</title>
<script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Widget.js"></script>
<script type="text/javascript">
var widgetAPI;
function init() {
  var status = document.getElementById('status');
  try {
    widgetAPI = new Common.API.Widget();
    widgetAPI.sendReadyEvent();
    status.innerHTML = 'SMART HUB PRONTO';
  } catch(e) {
    status.innerHTML = 'FALHA AO SINALIZAR PRONTO';
  }
}
</script>
<style type="text/css">
body{background:#101e32;color:white;font-family:Arial, sans-serif;margin:0;padding:70px;}
h1{font-size:60px;color:#66b8ff;}p{font-size:34px;}
</style>
</head>
<body onload="init()">
<h1>KTV BOOT TEST</h1>
<p>Se esta tela apareceu, o HTML abriu.</p>
<p id="status">Aguardando sinal ao Smart Hub...</p>
<p>Sem rede, HLS ou player de video.</p>
</body>
</html>
