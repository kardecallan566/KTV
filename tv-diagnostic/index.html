<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>KTVDiag</title>
  <meta name="viewport" content="width=1280" />
  <script type="text/javascript" src="$MANAGER_WIDGET/Common/API/Widget.js"></script>
  <script type="text/javascript" src="js/runtime-config.js"></script>
  <script type="text/javascript">
    var widgetAPI = null;
    function diagStart() {
      var ready = 'Biblioteca Samsung nao encontrada';
      try {
        if (window.Common && window.Common.API && window.Common.API.Widget) {
          widgetAPI = new window.Common.API.Widget();
          widgetAPI.sendReadyEvent();
          ready = 'Smart Hub notificado (sendReadyEvent)';
        }
      } catch (err) { ready = 'Falha ao notificar Smart Hub'; }
      document.getElementById('ready').innerHTML = ready;
      document.getElementById('server').innerHTML = window.KTV_DIAG_CONFIG.server;
      try {
        var xhr = new XMLHttpRequest();
        xhr.onreadystatechange = function() {
          if (xhr.readyState === 4) {
            document.getElementById('network').innerHTML =
              (xhr.status === 200) ? 'Rede local: OK (HTTP 200)' : 'Rede local: HTTP ' + xhr.status;
          }
        };
        xhr.open('GET', window.KTV_DIAG_CONFIG.server + '/api/health?client=diagnostic&ts=' + (new Date()).getTime(), true);
        xhr.send(null);
      } catch (err2) { document.getElementById('network').innerHTML = 'Nao foi possivel testar a rede'; }
      document.onkeydown = function(e) {
        e = e || window.event;
        if (e.keyCode === 13) { document.getElementById('press').innerHTML = 'ENTER recebido pelo aplicativo'; }
      };
    }
  </script>
  <style type="text/css">
    html,body{margin:0;padding:0;width:100%;height:100%;background:#091626;color:#fff;font-family:Arial,Helvetica,sans-serif;}
    #page{padding:80px;}h1{font-size:62px;color:#65b4ff;margin:0 0 24px;}p{font-size:29px;line-height:1.5;}
    .ok{color:#8fe3ba;font-weight:bold;}.small{font-size:22px;color:#b0c5df;}
  </style>
</head>
<body onload="diagStart()">
  <div id="page">
    <h1>KTV DIAGNOSTICO</h1>
    <p class="ok">Se esta tela apareceu, o Smart Hub iniciou o widget minimo.</p>
    <p id="ready">Verificando biblioteca Samsung...</p>
    <p id="network">Verificando conexao de rede...</p>
    <p id="server" class="small"></p>
    <p id="press" class="small">Pressione ENTER no controle remoto para testar.</p>
  </div>
</body>
</html>
