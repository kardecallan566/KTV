<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>KTV Local</title>
  <meta name="viewport" content="width=1280, initial-scale=1.0" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Sobrescrito no empacotamento: endereço IP local do computador -->
  <script src="js/runtime-config.js"></script>
  <script>
  // Sinal de abertura do HTML, mesmo que app.js nao consiga iniciar na TV.
  try {
    var bootXHR = new XMLHttpRequest();
    var bootClient = (window.KTV_CONFIG && window.KTV_CONFIG.client) || 'preview';
    var bootServer = (window.KTV_CONFIG && window.KTV_CONFIG.server) || '';
    bootXHR.open('GET', bootServer + '/api/event?client=' + bootClient + '&event=html-start&ts=' + (new Date()).getTime(), true);
    bootXHR.send(null);
  } catch (bootError) {}
  </script>
  <script src="js/app.js"></script>
</head>
<body onload="KTV.start()">
  <div id="frame">
    <div id="welcome">
      <div class="logo">K<span>TV</span></div>
      <h1 id="welcome-title">Conectando ao servidor local</h1>
      <p id="welcome-detail">Deixe o servidor KTV aberto no computador.</p>
      <p class="muted" id="server-url"></p>
    </div>
    <img id="image-player" alt="Midia KTV" />
    <!-- Videos e plugin Samsung so sao criados depois da acao ENTER (modo seguro). -->
    <div id="error-banner" class="hidden"></div>
    <div id="hud">
      <span class="brand">KTV <span class="label">LOCAL 0.4.1</span></span>
      <span id="media-name">Aguardando conteudo</span>
      <span id="network-status">Iniciando...</span>
    </div>
    <div id="hint">ESQUERDA / DIREITA: trocar &nbsp; · &nbsp; ENTER: pausar &nbsp; · &nbsp; CIMA: detalhes</div>
  </div>
</body>
</html>
